# CI/CD: mỗi lần push lên main -> chạy test backend -> deploy backend (Render) và frontend (Vercel).
name: Deploy
on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Chạy test
        run: mvn -B test
        working-directory: backend
      - name: Gọi Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Chưa đặt secret RENDER_DEPLOY_HOOK, bỏ qua deploy backend."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

  frontend:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build kiểm tra
        run: npm run build
      - name: Deploy lên Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Chưa đặt secret VERCEL_TOKEN, bỏ qua deploy frontend."
            exit 0
          fi
          npm install -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
