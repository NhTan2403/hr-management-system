# MySQL cho môi trường chạy trên máy (cổng 3307 để không đụng MySQL đã cài sẵn).
services:
  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: mvp
      MYSQL_USER: mvp
      MYSQL_PASSWORD: mvp
      MYSQL_ROOT_PASSWORD: mvp-root
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
